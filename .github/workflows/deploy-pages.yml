name: Deploy TravelMate Preview

on:
  push:
    branches: [preview]
  pull_request:
    branches: [preview]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: travelmate-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Classify cumulative distribution (fail closed)
        run: node tools/classify-distribution.mjs "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Verify JavaScript syntax
        run: |
          find assets tools tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check

      - name: Run regression tests
        run: node --test tests/*.test.js

      - name: Verify required files
        run: |
          test -f index.html
          test -f assets/app.js
          test -f assets/styles.css
          test -f trip/custom/index.html
          test -f supabase/migrations/20260914041455_trip_revision_and_tombstones.sql

  deploy:
    if: github.event_name == 'push'
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      TRAVELMATE_WEB_CHANNEL: preview
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Prepare static site
        run: |
          mkdir _site
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.agents' \
            --exclude='.codex' \
            --exclude='supabase' \
            --exclude='docs' \
            --exclude='native-overlay' \
            --exclude='ota-native' \
            --exclude='tools' \
            --exclude='tests' \
            --exclude='android' \
            --exclude='ios' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='capacitor.config.json' \
            --exclude='AGENTS.md' \
            --exclude='README.md' \
            ./ _site/
          node tools/stamp-web-build.mjs _site
          touch _site/.nojekyll

      - name: Read pinned native overlay
        id: overlay
        run: |
          node -e "const p=require('./ota-overlay.json');if(!/^[a-f0-9]{40}$/.test(p.sha))throw Error('Exact overlay SHA required');require('fs').appendFileSync(process.env.GITHUB_OUTPUT,'sha='+p.sha+'\n')"

      - name: Checkout pinned native overlay
        uses: actions/checkout@v7
        with:
          repository: lioracl/travelmate
          ref: ${{ steps.overlay.outputs.sha }}
          path: native-overlay
          persist-credentials: false

      - name: Build signed native OTA from this web SHA
        env:
          TRAVELMATE_OTA_PRIVATE_KEY: ${{ secrets.TRAVELMATE_OTA_PRIVATE_KEY }}
        run: |
          test -n "$TRAVELMATE_OTA_PRIVATE_KEY" || { echo '::error::OTA signing secret is required'; exit 1; }
          node native-overlay/tools/stage-native-web.mjs _site ota-native
          node native-overlay/tools/publish-ota.mjs ota-native _site/ota
          node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('_site/build-info.json')),b=JSON.parse(fs.readFileSync('ota-native/build-info.json'));if(a.sha!==b.sha||a.sha!==process.env.GITHUB_SHA)throw Error('Web/OTA SHA mismatch')"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
