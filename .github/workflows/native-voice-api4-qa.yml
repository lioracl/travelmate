name: Native Voice API 4 QA
on:
  push:
    branches: ['codex/mate-voice-actions-native-20261015']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/*.test.js
      - run: npm run native:sync
      - name: Java, JVM and lint
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugJavaWithJavac :app:check --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-api4-evidence
          path: |
            android/app/build/reports
            android/app/build/test-results
