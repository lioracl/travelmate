name: TravelMate Android Foundation QA

on:
  workflow_dispatch:
  pull_request:
    branches:
      - preview

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TRAVELMATE_QA_KEYSTORE_BASE64: ${{ secrets.TRAVELMATE_QA_KEYSTORE_BASE64 }}
      TRAVELMATE_QA_STORE_PASSWORD: ${{ secrets.TRAVELMATE_QA_STORE_PASSWORD }}
      TRAVELMATE_QA_KEY_ALIAS: ${{ secrets.TRAVELMATE_QA_KEY_ALIAS }}
      TRAVELMATE_QA_KEY_PASSWORD: ${{ secrets.TRAVELMATE_QA_KEY_PASSWORD }}
      TRAVELMATE_QA_CERT_SHA256: ${{ vars.TRAVELMATE_QA_CERT_SHA256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install native tooling
        run: npm ci --no-audit

      - name: Sync TravelMate web runtime into Android
        run: npm run native:sync

      - name: Stamp exact source revision
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)" node -e "const fs=require('fs');const info=JSON.parse(fs.readFileSync('android/app/src/main/assets/public/build-info.json'));if(info.sha!==process.env.SOURCE_SHA)throw Error('Embedded source SHA mismatch')"

      - name: Test signing certificate identity guard
        run: python3 tools/test_android_signing.py

      - name: Configure stable QA signing when available
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$TRAVELMATE_QA_KEYSTORE_BASE64$TRAVELMATE_QA_STORE_PASSWORD$TRAVELMATE_QA_KEY_ALIAS$TRAVELMATE_QA_KEY_PASSWORD$TRAVELMATE_QA_CERT_SHA256" ]]; then
            for NAME in TRAVELMATE_QA_KEYSTORE_BASE64 TRAVELMATE_QA_STORE_PASSWORD TRAVELMATE_QA_KEY_ALIAS TRAVELMATE_QA_KEY_PASSWORD TRAVELMATE_QA_CERT_SHA256; do
              [[ -n "${!NAME}" ]] || { echo "::error::Incomplete QA signing configuration: $NAME"; exit 1; }
            done
            umask 077
            printf '%s' "$TRAVELMATE_QA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/travelmate-qa.keystore"
            echo "TRAVELMATE_QA_KEYSTORE=$RUNNER_TEMP/travelmate-qa.keystore" >> "$GITHUB_ENV"
          else
            echo "::error::Permanent QA signing must be configured before building a distributable APK."
            exit 1
          fi

      - name: Run native unit tests and build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Verify signature, manifest, resources and source revision
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > /tmp/travelmate-signature.txt
          cat /tmp/travelmate-signature.txt
          python3 tools/verify-android-signing.py /tmp/travelmate-signature.txt android/app/build/outputs/apk/debug/signing-certificate.json
          "$BUILD_TOOLS/aapt" dump badging "$APK" > /tmp/travelmate-badging.txt
          grep -q "package: name='com.travelmate.app'.*versionName='2.21.1'" /tmp/travelmate-badging.txt
          "$BUILD_TOOLS/aapt" dump xmltree "$APK" AndroidManifest.xml > /tmp/travelmate-manifest.txt
          for ENTRY in TravelMateWidgetProvider TravelMateLiveTodayWidgetProvider travelmate LAUNCHER; do grep -q "$ENTRY" /tmp/travelmate-manifest.txt; done
          python3 tools/verify-android-apk.py "$APK" "$(git rev-parse HEAD)"
          cp "$APK" "android/app/build/outputs/apk/debug/TravelMate-2.21.1-$(git rev-parse --short=12 HEAD)-debug.apk"

      - name: Remove temporary QA keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/travelmate-qa.keystore"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: travelmate-v2.21-debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            android/app/build/outputs/apk/debug/TravelMate-*-debug.apk
            android/app/build/outputs/apk/debug/signing-certificate.json
          if-no-files-found: error
          retention-days: 7
