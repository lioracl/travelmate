name: TravelMate Android Foundation QA

on:
  workflow_dispatch:
  pull_request:
    branches:
      - preview

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install native tooling
        run: npm ci --no-audit

      - name: Sync TravelMate web runtime into Android
        run: npm run native:sync

      - name: Stamp exact source revision
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)" node -e "const fs=require('fs');fs.writeFileSync('android/app/src/main/assets/public/build-info.json',JSON.stringify({sha:process.env.SOURCE_SHA,version:require('./package.json').version,buildType:'debug'}))"

      - name: Run native unit tests and build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Verify signature, manifest, resources and source revision
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > /tmp/travelmate-badging.txt
          grep -q "package: name='com.travelmate.app'.*versionName='2.21.0'" /tmp/travelmate-badging.txt
          "$BUILD_TOOLS/aapt" dump xmltree "$APK" AndroidManifest.xml > /tmp/travelmate-manifest.txt
          for ENTRY in TravelMateWidgetProvider TravelMateLiveTodayWidgetProvider travelmate LAUNCHER; do grep -q "$ENTRY" /tmp/travelmate-manifest.txt; done
          python3 tools/verify-android-apk.py "$APK" "$(git rev-parse HEAD)"
          cp "$APK" "android/app/build/outputs/apk/debug/TravelMate-2.21.0-$(git rev-parse --short=12 HEAD)-debug.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: travelmate-v2.21-debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: android/app/build/outputs/apk/debug/TravelMate-*-debug.apk
          if-no-files-found: error
          retention-days: 7
