name: Apply verified Smart Trip alternatives once

on:
  push:
    branches:
      - codex/smart-trip-2-decision-layer-20261013

permissions:
  contents: write

jobs:
  apply-verify-commit:
    if: "${{ github.event.head_commit.message == 'chore: apply verified Smart Trip alternatives' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: codex/smart-trip-2-decision-layer-20261013
          fetch-depth: 0

      - name: Guard expected branch and parent
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "codex/smart-trip-2-decision-layer-20261013"
          test "$(git rev-parse HEAD^)" = "fd4a1298f82b2f4054ba447a8a27d110b1184f55"
          git diff --quiet

      - name: Apply exact verified candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin integration/smart-trip-real-alternatives-20261014
          git show FETCH_HEAD:scripts/qa/smart-trip-real-alternatives-candidate.js > /tmp/smart-trip-real-alternatives-candidate.js
          node /tmp/smart-trip-real-alternatives-candidate.js
          node --check assets/smart-trip-decisions.js
          node --check assets/smart-trip-actions.js
          git diff --check

      - name: Focused Node alternatives
        run: node --test tests/smart-trip-decisions.test.js tests/smart-trip-actions.test.js

      - name: Full Node regression
        run: node --test tests/*.test.js

      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/travelmate-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/travelmate-http.log
          exit 1

      - name: Focused alternatives E2E
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/smart-trip-alternatives.spec.js tests/e2e/smart-trip-decisions.spec.js --reporter=line

      - name: Full Integration QA
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e --reporter=line

      - name: Commit verified source and tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/smart-trip-decisions.js assets/smart-trip-actions.js tests/smart-trip-decisions.test.js tests/e2e/smart-trip-alternatives.spec.js
          git rm .github/workflows/smart-trip-real-alternatives-apply-once.yml
          git commit -m "feat: add verified Smart Trip itinerary alternatives"
          git push origin HEAD:codex/smart-trip-2-decision-layer-20261013
