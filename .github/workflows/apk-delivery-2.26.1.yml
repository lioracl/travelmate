name: TravelMate QA APK Delivery 2.26.1

on:
  push:
    branches:
      - 'qa/apk-delivery-2.26.1-81ff0634'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deliver-verified-signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APK_NAME: TravelMate-QA-2.26.1-22601-native2-81ff0634.apk
      EXPECTED_SHA256: 2368c73517f247f5ed104950628616225a4e7ae77057c807f48b12e66f9daa14
      SOURCE_URL: https://litter.catbox.moe/fy8jl5.apk

    steps:
      - name: Download already-signed QA APK
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 20 --max-time 180 \
            "$SOURCE_URL" -o "$APK_NAME"
          test -s "$APK_NAME"
          stat -c 'size=%s bytes' "$APK_NAME"

      - name: Verify exact APK bytes
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(sha256sum "$APK_NAME" | awk '{print $1}')"
          echo "expected=$EXPECTED_SHA256"
          echo "actual=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED_SHA256"
          printf '%s  %s\n' "$ACTUAL" "$APK_NAME" > "${APK_NAME%.apk}.sha256"

      - name: Upload exact verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TravelMate-QA-2.26.1-22601-native2-81ff0634
          path: |
            TravelMate-QA-2.26.1-22601-native2-81ff0634.apk
            TravelMate-QA-2.26.1-22601-native2-81ff0634.sha256
          if-no-files-found: error
          retention-days: 7
