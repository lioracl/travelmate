name: Smart Trip real alternatives candidate

on:
  push:
    branches:
      - integration/smart-trip-real-alternatives-20261014

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: integration/smart-trip-real-alternatives-20261014
          fetch-depth: 0

      - name: Apply candidate in workspace only
        run: node scripts/qa/smart-trip-real-alternatives-candidate.js

      - name: Syntax and diff guard
        run: |
          node --check assets/smart-trip-decisions.js
          node --check assets/smart-trip-actions.js
          git diff --check

      - name: Focused Node alternatives
        run: node --test tests/smart-trip-decisions.test.js tests/smart-trip-actions.test.js

      - name: Full Node regression
        run: node --test tests/*.test.js

      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/travelmate-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/travelmate-http.log
          exit 1

      - name: Focused alternatives E2E
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/smart-trip-alternatives.spec.js tests/e2e/smart-trip-decisions.spec.js --reporter=line

      - name: Full Integration QA
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e --reporter=line
