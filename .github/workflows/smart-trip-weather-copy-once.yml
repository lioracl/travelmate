name: Smart Trip weather copy candidate

on:
  push:
    branches:
      - integration/smart-trip-weather-copy-20261014

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: integration/smart-trip-weather-copy-20261014
          fetch-depth: 0

      - name: Apply weather copy candidate in workspace only
        run: node scripts/qa/smart-trip-weather-copy-candidate.js

      - name: Syntax and diff guard
        run: |
          node --check assets/smart-trip-decisions.js
          git diff --check

      - name: Focused Smart Trip Node
        run: node --test tests/smart-trip-decisions.test.js

      - name: Full Node regression
        run: node --test tests/*.test.js
