name: TravelMate QA APK Delivery 2.27.0

on:
  push:
    branches:
      - 'qa/apk-build-2.27.0-53c52aa'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deliver-verified-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APK_NAME: TravelMate-QA-2.27.0-22700-native3-53c52aae-newsig.apk
      EXPECTED_SHA256: ff39f670638bddf03749008bf85ed63ae0a2bf13d47f50f9c04931b288751126
      SOURCE_URL: https://files.catbox.moe/mjetzh.apk

    steps:
      - name: Download signed QA APK
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 20 --max-time 180 \
            "$SOURCE_URL" -o "$APK_NAME"
          test -s "$APK_NAME"
          stat -c 'size=%s bytes' "$APK_NAME"

      - name: Verify exact APK bytes
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(sha256sum "$APK_NAME" | awk '{print $1}')"
          echo "expected=$EXPECTED_SHA256"
          echo "actual=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED_SHA256"
          printf '%s  %s\n' "$ACTUAL" "$APK_NAME" > "${APK_NAME%.apk}.sha256"

      - name: Upload exact verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TravelMate-QA-2.27.0-22700-native3-53c52aae-newsig
          path: |
            TravelMate-QA-2.27.0-22700-native3-53c52aae-newsig.apk
            TravelMate-QA-2.27.0-22700-native3-53c52aae-newsig.sha256
          if-no-files-found: error
          retention-days: 7
