name: TravelMate Integration QA

on:
  workflow_dispatch:
  push:
    branches:
      - 'integration/**'
      - 'codex/mate-voice-recovery-20261015'
      - 'codex/mate-voice-2262-ota-recovery-20261015'
  pull_request:
    branches:
      - preview

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify syntax, distribution and whitespace
        run: |
          find assets tools tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          node tools/classify-distribution.mjs "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --check HEAD^

      - name: Run contract and regression tests
        run: node --test tests/*.test.js

      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/travelmate-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/travelmate-http.log
          exit 1

      - name: Run integration QA
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e --workers=2 --retries=0 --reporter=line

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: travelmate-playwright-report
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
